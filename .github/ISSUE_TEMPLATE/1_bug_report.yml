name: Bug Report
description: Create a report of your issue
labels: ["bug"]
body:
- type: checkboxes
  attributes:
    label: Is there an existing issue for this?
    description: Please search to see if an issue already exists for the bug you encountered.
    options:
    - label: I have searched the existing issues
      required: true

- type: textarea
  attributes:
    label: Description of the bug
    description: A concise description of what the bug is.
    render: markdown
  validations:
    required: true

- type: textarea
  attributes:
    label: Steps to reproduce
    description: Concise steps to reproduce the behaviour.
    placeholder: |
      1. Go to '...'
      2. Click on '....'
      3. Scroll down to '....'
      4. See error
    render: markdown
  validations:
    required: true

- type: textarea
  attributes:
    label: Expected behaviour
    description: What should've happened, or did you expect to happen?
    render: markdown
  validations:
    required: true

- type: textarea
  attributes:
    label: Environment and version info
    value: |
      - MIND Version:
      - Python Version:
      - Using Docker [yes/no]: 
      - OS:
      - Browser:
    render: markdown
  validations:
    required: true

- type: textarea
  attributes:
    label: Additional data
    description: Paste logs and/or screenshots below.
    render: markdown
  validations:
    required: false
