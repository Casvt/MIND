name: Feature Request
description: Suggest a feature for this project
labels: ["enhancement"]
body:
- type: checkboxes
  attributes:
    label: Is there an existing issue for this?
    description: Please search to see if an issue already exists for the feature.
    options:
    - label: I have searched the existing issues
      required: true

- type: textarea
  attributes:
    label: Is your feature request related to a problem? Please describe.
    description: A clear and concise description of what the problem is.
    placeholder: I'm always frustrated when [...]
    render: markdown
  validations:
    required: false

- type: textarea
  attributes:
    label: Describe the feature you'd like
    description: A clear and concise description of what you want to happen.
    render: markdown
  validations:
    required: true

- type: textarea
  attributes:
    label: Additional notes
    description: If needed, add context, screenshots, details or anything else about the feature request here.
    render: markdown
  validations:
    required: false
